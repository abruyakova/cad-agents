[project]
name = "pythonproject"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-chroma",
    "langchain-ollama",
    "langchain-text-splitters",
    "ollama>=0.6.2",
    "prometheus-client",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
